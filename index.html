<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Pet Memory・寵物日記</title>
<meta name="apple-mobile-web-app-title" content="Pet Memory">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EF; --paper-card:#FFFFFF;
    --ink:#3B2A20; --ink-soft:#6B5645;
    --clay:#C1702E; --clay-soft:#F3E3D2;
    --sage:#7A8C63; --muted:#9A8D7C; --border:#EDE1D0; --danger:#B3261E;
    --font-display:"Noto Serif TC",serif;
    --font-body:"Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:var(--font-body);cursor:pointer;}
  a{color:var(--clay);}
  input,select,textarea{font-family:var(--font-body);}

  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ink);color:var(--paper);gap:8px;}
  .top-bar .brand{font-family:var(--font-display);font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;}
  .top-bar .brand .stamp{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--clay);font-size:13px;flex-shrink:0;}
  .top-bar .user-info{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;min-width:0;flex-shrink:1;}
  .top-bar button.ghost{background:transparent;border:1px solid rgba(251,246,239,.4);color:var(--paper);padding:6px 12px;border-radius:999px;font-size:12.5px;flex-shrink:0;white-space:nowrap;}
  .top-bar button.ghost:hover{border-color:var(--paper);}
  .profile-trigger{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--paper);font-size:13px;cursor:pointer;padding:0;min-width:0;max-width:120px;}
  .profile-trigger span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .avatar-mini{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid rgba(251,246,239,.5);background:var(--clay-soft);}
  .avatar-mini-fallback{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:12px;font-weight:600;color:#fff;background:var(--clay);}

  #root{max-width:100%;overflow-x:hidden;}
  .container{max-width:520px;margin:0 auto;padding:28px 18px 70px;}

  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0 0 6px;}
  h1{font-size:26px;} h2{font-size:19px;}
  .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--clay);text-transform:uppercase;display:block;margin-bottom:4px;}
  .subtitle{color:var(--muted);font-size:13.5px;margin:0 0 20px;line-height:1.6;}

  .card{background:var(--paper-card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}

  .field{margin-bottom:14px;min-width:0;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;min-width:0;box-sizing:border-box;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--paper);color:var(--ink);}
  .field input:focus,.field textarea:focus{outline:2px solid var(--ink-soft);outline-offset:1px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:999px;border:none;font-size:14px;font-weight:600;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-accent{background:var(--clay);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--ink);color:var(--ink);}
  .btn-google{background:#fff;border:1px solid var(--border);color:var(--ink-soft);}
  .btn-block{width:100%;}

  .message{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.6;}
  .message.error{background:#FBEAE7;color:var(--danger);}
  .message.success{background:#EEF3E6;color:var(--sage);}

  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{max-width:380px;width:100%;background:var(--paper-card);border:1px solid var(--border);border-radius:18px;padding:34px 28px;}
  .auth-card h1{text-align:center;margin-bottom:4px;}
  .auth-card .subtitle{text-align:center;}
  .auth-toggle{text-align:center;font-size:13px;margin-top:14px;color:var(--muted);}
  .auth-toggle a{cursor:pointer;text-decoration:underline;}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px;}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .verify-badge-box{margin:12px 0 14px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--paper);text-align:center;line-height:1.55;}
  .verify-badge-box .big{font-size:20px;font-weight:800;color:var(--danger);margin:2px 0;}

  .pet-card{display:flex;gap:14px;align-items:center;cursor:pointer;}
  .pet-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--clay-soft);flex-shrink:0;}
  .empty-state{text-align:center;padding:36px 16px;color:var(--muted);font-size:13.5px;line-height:1.7;}

  @media (max-width:600px){
    .container{padding:20px 12px 60px;}
  }
</style>
</head>
<body>
<div id="topBar" class="top-bar hidden">
  <div class="brand"><span class="stamp">🐾</span> Pet Memory</div>
  <div class="user-info">
    <button class="profile-trigger" id="profileBtn"></button>
    <button id="logoutBtn" class="ghost">登出</button>
  </div>
</div>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
/* ============================================================
   換成你自己的 firebaseConfig(Firebase Console → 專案設定 → 你的應用程式)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCOOa7GfTd6nVCemYGifcTM8uI0xYhCl3A",
  authDomain: "pet-memory-613ec.firebaseapp.com",
  projectId: "pet-memory-613ec",
  storageBucket: "pet-memory-613ec.firebasestorage.app",
  messagingSenderId: "374256947356",
  appId: "1:374256947356:web:9d4ed0bef8b193b5001d59"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.languageCode = 'zh-TW';
const db = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();

// ------------------------------------------------------------
// 全域狀態
// ------------------------------------------------------------
let currentUser = null;
let currentProfile = null;
let authMode = 'login';

const root = document.getElementById('root');
const topBar = document.getElementById('topBar');
const profileBtn = document.getElementById('profileBtn');

// ------------------------------------------------------------
// 共用小工具
// ------------------------------------------------------------
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function showMsg(boxId, text, type){
  const box = document.getElementById(boxId);
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'message ' + (type||'error');
  el.textContent = text;
  box.prepend(el);
  setTimeout(()=>el.remove(), 4500);
}
function showMailNotice(boxId, intro){
  const box = document.getElementById(boxId);
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'message success';
  el.style.textAlign = 'center';
  const line1 = document.createElement('div');
  line1.textContent = intro;
  const line2 = document.createElement('div');
  line2.textContent = '垃圾郵件';
  line2.style.fontSize = '20px';
  line2.style.fontWeight = '800';
  line2.style.margin = '4px 0';
  line2.style.color = 'var(--danger)';
  const line3 = document.createElement('div');
  line3.textContent = '如果收件匣沒有看到，請記得檢查垃圾郵件匣。';
  line3.style.fontSize = '12px';
  el.append(line1, line2, line3);
  box.prepend(el);
  setTimeout(()=>el.remove(), 9000);
}
function friendlyAuthError(err){
  const map = {
    'auth/email-already-in-use':'這個 email 已經被註冊過了',
    'auth/invalid-email':'email 格式不正確',
    'auth/weak-password':'密碼至少需要 6 個字元',
    'auth/user-not-found':'找不到這個帳號',
    'auth/wrong-password':'密碼錯誤',
    'auth/invalid-credential':'email 或密碼錯誤',
    'auth/too-many-requests':'嘗試太多次了，請稍後再試',
    'auth/network-request-failed':'網路連線失敗，請檢查網路後再試',
    'auth/popup-closed-by-user':'登入視窗已關閉',
    'auth/unauthorized-domain':'這個網域還沒被授權使用 Google 登入'
  };
  return (err && map[err.code]) || (err && err.message) || '發生未知錯誤';
}
function avatarSrc(profile){ return (profile && profile.avatar) ? profile.avatar : null; }
function avatarInitial(profile){
  const name = (profile && (profile.displayName || profile.email)) || '?';
  return name.charAt(0).toUpperCase();
}
function renderTopBar(){
  if(!currentProfile) return;
  const src = avatarSrc(currentProfile);
  profileBtn.innerHTML = src
    ? `<img class="avatar-mini" src="${src}">`
    : `<span class="avatar-mini-fallback">${esc(avatarInitial(currentProfile))}</span>`;
  profileBtn.innerHTML += `<span>${esc(currentProfile.displayName || currentProfile.email)}</span>`;
}
profileBtn.addEventListener('click', ()=>{ if(currentProfile) openProfileModal(); });
document.getElementById('logoutBtn').addEventListener('click', ()=>auth.signOut());

// ==============================================================
// Email 驗證畫面
// ==============================================================
function renderEmailVerificationView(user){
  const email = (user && user.email) ? user.email : '';
  root.innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <h1>📧 驗證你的 Email</h1>
        <p class="subtitle">認證信已寄到<br><strong>${esc(email)}</strong><br>請到信箱點擊驗證連結，完成後再回到這裡。</p>
        <div class="verify-badge-box">
          <div style="font-size:13px;color:var(--ink-soft);">⚠️ 認證信有可能會被分類到</div>
          <div class="big">垃圾郵件</div>
          <div style="font-size:12px;color:var(--ink-soft);">如果收件匣沒有看到，請記得檢查垃圾郵件匣。</div>
        </div>
        <div id="verifyMsgBox"></div>
        <button type="button" class="btn btn-accent btn-block" id="checkVerifiedBtn">我已完成驗證</button>
        <button type="button" class="btn btn-outline btn-block" id="resendVerificationBtn" style="margin-top:8px;">重新寄送認證信</button>
        <button type="button" class="btn btn-outline btn-block" id="verifyLogoutBtn" style="margin-top:8px;">登出</button>
      </div>
    </div>
  `;

  document.getElementById('checkVerifiedBtn').onclick = async ()=>{
    const btn = document.getElementById('checkVerifiedBtn');
    btn.disabled = true; btn.textContent = '確認中…';
    try{
      if(!auth.currentUser){ await auth.signOut(); return; }
      await auth.currentUser.reload();
      if(auth.currentUser.emailVerified){
        await auth.currentUser.getIdToken(true);
        try{ await db.collection('users').doc(auth.currentUser.uid).set({ emailVerified: true }, {merge:true}); }catch(e){}
        showMsg('verifyMsgBox', 'Email 驗證完成！正在進入 App…', 'success');
        setTimeout(()=>location.reload(), 500);
      } else {
        showMsg('verifyMsgBox', '目前還沒收到驗證完成狀態，請先到信箱點擊驗證連結。');
        btn.disabled = false; btn.textContent = '我已完成驗證';
      }
    }catch(err){
      showMsg('verifyMsgBox', friendlyAuthError(err));
      btn.disabled = false; btn.textContent = '我已完成驗證';
    }
  };

  document.getElementById('resendVerificationBtn').onclick = async ()=>{
    const btn = document.getElementById('resendVerificationBtn');
    btn.disabled = true; btn.textContent = '寄送中…';
    try{
      if(!auth.currentUser) throw new Error('登入狀態已失效，請重新登入');
      await auth.currentUser.sendEmailVerification();
      showMailNotice('verifyMsgBox', '認證信已重新寄出。信件有可能會被分類到');
      btn.textContent = '已寄出';
      setTimeout(()=>{ if(document.body.contains(btn)){ btn.disabled=false; btn.textContent='重新寄送認證信'; } }, 30000);
    }catch(err){
      showMsg('verifyMsgBox', friendlyAuthError(err));
      btn.disabled = false; btn.textContent = '重新寄送認證信';
    }
  };

  document.getElementById('verifyLogoutBtn').onclick = ()=>auth.signOut();
}

// ==============================================================
// 認證：監聽登入狀態
// ==============================================================
auth.onAuthStateChanged(async (user)=>{
  currentUser = user;

  if(user && !user.emailVerified){
    topBar.classList.add('hidden');
    currentProfile = null;
    renderEmailVerificationView(user);
    return;
  }

  if(user){
    topBar.classList.remove('hidden');
    root.innerHTML = `
      <div class="container" style="text-align:center;padding-top:80px;">
        <div style="font-size:36px;margin-bottom:10px;">🐾</div>
        <p class="subtitle" style="margin:0;">登入中，正在準備你的資料…</p>
      </div>
    `;
    try{ await db.collection('users').doc(user.uid).set({ emailVerified: true }, {merge:true}); }catch(e){}
    try{
      const snap = await db.collection('users').doc(user.uid).get();
      currentProfile = snap.exists ? snap.data() : {email:user.email, displayName:user.email.split('@')[0]};
    }catch(e){
      currentProfile = {email:user.email, displayName:user.email.split('@')[0]};
    }
    renderTopBar();
    await renderPetsView();
  } else {
    topBar.classList.add('hidden');
    authMode = 'login';
    renderAuthView();
  }
});

// ==============================================================
// 認證畫面(信箱註冊/登入 + Google 登入 + 忘記密碼)
// ==============================================================
function renderAuthView(){
  root.innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <h1>🐾 Pet Memory</h1>
        <p class="subtitle">${authMode==='login' ? '登入你的帳號' : '建立新帳號，開始記錄你的寵物'}</p>
        <div id="authMsgBox"></div>
        <button type="button" class="btn btn-google btn-block" id="googleSignInBtn">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.7 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9C43.9 37.6 46.5 31.6 46.5 24.5z"/><path fill="#FBBC05" d="M10.5 19.3l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.8l7.9-6.1c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7z"/><path fill="#34A853" d="M24 48c6.2 0 11.7-2 15.6-5.6l-7.6-5.9c-2.1 1.4-4.8 2.3-8 2.3-6.3 0-11.6-4.3-13.5-10.1l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          使用 Google 登入
        </button>
        <div class="auth-divider">或</div>
        <form id="authForm">
          ${authMode==='register' ? `
          <div class="field">
            <label>暱稱</label>
            <input type="text" id="displayName" placeholder="大家會看到的名字" required>
          </div>` : ''}
          <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label>密碼</label>
            <input type="password" id="password" placeholder="至少 6 個字元" minlength="6" required>
          </div>
          ${authMode==='register' ? `
          <div class="field">
            <label>確認密碼</label>
            <input type="password" id="passwordConfirm" placeholder="再輸入一次密碼" minlength="6" required>
          </div>` : ''}
          <button type="submit" class="btn btn-accent btn-block">${authMode==='login' ? '登入' : '註冊'}</button>
          ${authMode==='login' ? `
            <p class="auth-toggle" style="margin:10px 0 0;text-align:right;">
              <a id="forgotPassword">忘記密碼？</a>
            </p>
          ` : ''}
        </form>
        <p class="auth-toggle">
          ${authMode==='login'
            ? `還沒有帳號？<a id="switchAuth">立即註冊</a>`
            : `已經有帳號了？<a id="switchAuth">前往登入</a>`}
        </p>
      </div>
    </div>
  `;

  document.getElementById('switchAuth').onclick = ()=>{
    authMode = authMode==='login' ? 'register' : 'login';
    renderAuthView();
  };

  document.getElementById('googleSignInBtn').onclick = async ()=>{
    const btn = document.getElementById('googleSignInBtn');
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '登入中，請稍候…';
    try{
      await auth.signInWithPopup(googleProvider);
      // 成功後 onAuthStateChanged 會接手渲染下一個畫面，這裡不用做事，
      // 但保留載入中的文字，避免畫面切換前使用者又點一次按鈕
    }catch(err){
      showMsg('authMsgBox', friendlyAuthError(err));
      btn.disabled = false;
      btn.innerHTML = originalHTML;
    }
  };

  const forgotPasswordEl = document.getElementById('forgotPassword');
  if(forgotPasswordEl){
    forgotPasswordEl.onclick = async ()=>{
      const emailEl = document.getElementById('email');
      const email = emailEl.value.trim();
      if(!email){
        showMsg('authMsgBox', '請先輸入你的 Email，再按「忘記密碼」。');
        emailEl.focus();
        return;
      }
      forgotPasswordEl.style.pointerEvents = 'none';
      forgotPasswordEl.style.opacity = '0.55';
      try{
        await auth.sendPasswordResetEmail(email);
        showMailNotice('authMsgBox', '如果這個 Email 有註冊帳號，重設密碼信會寄到你的信箱。信件有可能會被分類到');
      }catch(err){
        if(err && err.code === 'auth/user-not-found'){
          showMailNotice('authMsgBox', '如果這個 Email 有註冊帳號，重設密碼信會寄到你的信箱。信件有可能會被分類到');
        }else{
          showMsg('authMsgBox', friendlyAuthError(err));
        }
      }finally{
        forgotPasswordEl.style.pointerEvents = '';
        forgotPasswordEl.style.opacity = '';
      }
    };
  }

  document.getElementById('authForm').onsubmit = async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if(authMode==='register'){
      const passwordConfirm = document.getElementById('passwordConfirm').value;
      if(password !== passwordConfirm){
        showMsg('authMsgBox', '兩次輸入的密碼不一樣，請再確認一次');
        return;
      }
    }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try{
      if(authMode==='register'){
        const displayName = document.getElementById('displayName').value.trim();
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(cred.user.uid).set({
          email, displayName: displayName || email.split('@')[0],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        let mailErr = null;
        try{ await cred.user.sendEmailVerification(); }catch(e2){ mailErr = e2; }
        renderEmailVerificationView(cred.user);
        if(mailErr){
          showMsg('verifyMsgBox', '帳號已建立，但認證信暫時寄送失敗：' + friendlyAuthError(mailErr) + '。可以按「重新寄送認證信」再試一次。');
        }else{
          showMsg('verifyMsgBox', '帳號建立成功！認證信已寄出，請到信箱完成驗證。', 'success');
        }
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }
    }catch(err){
      showMsg('authMsgBox', friendlyAuthError(err));
      submitBtn.disabled = false;
    }
  };
}

// ==============================================================
// 個人資料設定
// ==============================================================
function openProfileModal(){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(59,42,32,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;';
  overlay.innerHTML = `
    <div class="card" style="max-width:340px;width:100%;">
      <div class="card-row" style="margin-bottom:16px;">
        <h3 style="margin:0;">編輯個人資料</h3>
        <button id="closeProfileModal" style="background:none;border:none;font-size:16px;color:var(--muted);cursor:pointer;">✕</button>
      </div>
      <div class="field">
        <label>暱稱</label>
        <input type="text" id="profileNameInput" value="${esc(currentProfile.displayName||'')}" maxlength="20">
      </div>
      <button class="btn btn-accent btn-block" id="saveProfileBtn">儲存</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('closeProfileModal').onclick = ()=>overlay.remove();
  overlay.onclick = (ev)=>{ if(ev.target===overlay) overlay.remove(); };
  document.getElementById('saveProfileBtn').onclick = async ()=>{
    const btn = document.getElementById('saveProfileBtn');
    const displayName = document.getElementById('profileNameInput').value.trim();
    if(!displayName){ alert('請輸入暱稱'); return; }
    btn.disabled = true; btn.textContent = '儲存中…';
    try{
      await db.collection('users').doc(currentUser.uid).update({ displayName });
      currentProfile.displayName = displayName;
      renderTopBar();
      overlay.remove();
      renderPetsView();
    }catch(err){
      alert('更新失敗：'+err.message);
      btn.disabled = false; btn.textContent = '儲存';
    }
  };
}

// ==============================================================
// 寵物列表首頁
// ==============================================================
async function renderPetsView(){
  root.innerHTML = `
    <div class="container">
      <div id="petsMsgBox"></div>
      <span class="eyebrow">Pet Memory</span>
      <h1>我的寵物</h1>
      <p class="subtitle">記錄牠們的每一天，陪伴永遠都在</p>
      <div id="petList"><div class="empty-state">載入中…</div></div>

      <div class="card">
        <h2>新增寵物</h2>
        <form id="addPetForm">
          <div class="field">
            <label>名字</label>
            <input type="text" id="petName" placeholder="例如：豆漿" required>
          </div>
          <div class="field">
            <label>種類</label>
            <select id="petSpecies">
              <option value="dog">狗狗</option>
              <option value="cat">貓咪</option>
            </select>
          </div>
          <button type="submit" class="btn btn-accent btn-block">建立寵物檔案</button>
        </form>
      </div>
    </div>
  `;

  document.getElementById('addPetForm').onsubmit = async (e)=>{
    e.preventDefault();
    const name = document.getElementById('petName').value.trim();
    const species = document.getElementById('petSpecies').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try{
      await db.collection('users').doc(currentUser.uid).collection('pets').add({
        name, species, status:'alive',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      renderPetsView();
    }catch(err){
      showMsg('petsMsgBox', '建立失敗：'+err.message);
      submitBtn.disabled = false;
    }
  };

  const listEl = document.getElementById('petList');
  try{
    const snap = await db.collection('users').doc(currentUser.uid).collection('pets').orderBy('createdAt','desc').get();
    const pets = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(pets.length===0){
      listEl.innerHTML = `<div class="empty-state">還沒有任何寵物檔案，在下面建立第一筆吧 🐾</div>`;
      return;
    }
    listEl.innerHTML = pets.map(p=>`
      <div class="card pet-card">
        <div class="pet-avatar" style="display:flex;align-items:center;justify-content:center;font-size:24px;">${p.species==='cat'?'🐱':'🐶'}</div>
        <div>
          <div style="font-weight:700;font-size:16px;">${esc(p.name)}</div>
          <div class="subtitle" style="margin:0;">${p.species==='cat'?'貓咪':'狗狗'}${p.status==='passed'?' · 已離世':''}</div>
        </div>
      </div>
    `).join('');
  }catch(err){
    listEl.innerHTML = `<div class="empty-state">載入失敗：${esc(err.message)}</div>`;
  }
}

root.innerHTML = `<div class="empty-state">載入中…</div>`;
</script>
</body>
</html>
