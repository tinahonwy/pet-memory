<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 貓咪模型測試</title>
<style>
  body{margin:0;font-family:-apple-system,'Noto Sans TC',sans-serif;background:#EDEEDF;color:#26301F;}
  #info{padding:16px 20px;}
  #info h1{font-size:18px;margin:0 0 4px;}
  #info p{font-size:13px;color:#68705C;margin:0 0 12px;}
  #canvas-wrap{width:100%;height:60vh;position:relative;background:#FFFFFC;}
  #canvas-wrap canvas{display:block;cursor:grab;}
  #canvas-wrap canvas:active{cursor:grabbing;}
  #controls{padding:16px 20px;background:#FFFFFC;border-top:1px solid #D9DCC5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:#68705C;margin-bottom:6px;font-weight:600;}
  .field input[type=color]{width:60px;height:36px;border:1.5px solid #D9DCC5;border-radius:8px;cursor:pointer;padding:2px;}
  .field input[type=range]{width:100%;}
  .swatch-row{display:flex;gap:8px;margin-top:8px;}
  .swatch-row button{width:36px;height:36px;border-radius:8px;border:2px solid transparent;cursor:pointer;}
  .swatch-row button.active{border-color:#26301F;}
  #status{font-size:12px;color:#9C5F34;padding:10px 20px;white-space:pre-wrap;line-height:1.6;}
  #status.err{color:#AE4A34;font-family:monospace;font-size:11px;}
  #status.ok{color:#4C6B3F;}
</style>
</head>
<body>
<div id="info">
  <h1>🐾 3D 貓咪模型測試</h1>
  <p>載入你上傳的模型，測試 Three.js 顯示與顏色套用效果</p>
</div>
<div id="status">載入中…</div>
<div id="canvas-wrap"></div>
<div id="controls">
  <div class="field">
    <label>毛色（可以拖 hex 色碼進來，也可以直接點選）</label>
    <input type="color" id="colorPicker" value="#151413">
    <div class="swatch-row" id="quickSwatches"></div>
  </div>
  <div class="field">
    <label>旋轉速度</label>
    <input type="range" id="rotateSpeed" min="0" max="0.02" step="0.001" value="0.006">
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const statusEl = document.getElementById('status');
const wrap = document.getElementById('canvas-wrap');

function setStatus(msg, cls){
  statusEl.textContent = msg;
  statusEl.className = cls || '';
}

try{
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFFFFFC);

  const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
  camera.position.set(0, 0.6, 3.2);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  wrap.appendChild(renderer.domElement);

  // 滑鼠拖曳可以旋轉視角、滾輪可以縮放，放開拖曳後會繼續原本的自動旋轉
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; // 拖曳放開後有一點慣性滑動，手感比較順
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.2;
  controls.maxDistance = 8;
  controls.target.set(0, 0, 0);
  controls.autoRotate = true;
  controls.autoRotateSpeed = 3;

  const ambient = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(2, 3, 4);
  scene.add(dirLight);
  const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
  dirLight2.position.set(-2, 1, -3);
  scene.add(dirLight2);

  let catMesh = null;

  const loader = new GLTFLoader();
  setStatus('正在下載 cat.glb…');

  // 用絕對於「這個 html 檔案所在資料夾」的相對路徑抓模型，
  // 用 import.meta.url 算出來，比單純寫 './cat.glb' 更不容易因為部署路徑不同而抓錯。
  const modelUrl = new URL('./cat.glb', import.meta.url).href;

  loader.load(
    modelUrl,
    (gltf) => {
      const model = gltf.scene;
      model.traverse(obj => {
        if(obj.isMesh){
          catMesh = obj;
          obj.material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(document.getElementById('colorPicker').value),
            roughness: 0.85,
            metalness: 0.05
          });
        }
      });
      scene.add(model);
      setStatus('✅ 模型載入成功，可以用下方調色盤試試套色效果', 'ok');
    },
    (progress) => {
      if(progress.total){
        const pct = Math.round(progress.loaded / progress.total * 100);
        setStatus(`正在下載 cat.glb…（${pct}%）`);
      }
    },
    (err) => {
      setStatus('❌ 模型載入失敗\n嘗試的路徑：' + modelUrl + '\n錯誤內容：' + (err && err.message ? err.message : String(err)) + '\n\n請確認 cat.glb 是否跟這個 html 檔案放在同一層資料夾，檔名大小寫是否完全一致。', 'err');
      console.error('GLTF load error:', err);
    }
  );

  function animate(){
    requestAnimationFrame(animate);
    controls.update(); // 一定要呼叫，不然阻尼跟自動旋轉都不會生效
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = wrap.clientWidth / wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  });

  document.getElementById('colorPicker').addEventListener('input', (e) => {
    if(catMesh) catMesh.material.color.set(e.target.value);
  });
  document.getElementById('rotateSpeed').addEventListener('input', (e) => {
    const v = Number(e.target.value);
    controls.autoRotate = v > 0;
    controls.autoRotateSpeed = v * 500; // 滑桿數值很小(0~0.02)，換算成 OrbitControls 習慣的速度單位
  });

  const testColors = ['#151413', '#060505', '#2c2924', '#979185', '#BE7A46', '#F1E2CE'];
  const swatchRow = document.getElementById('quickSwatches');
  testColors.forEach(hex => {
    const btn = document.createElement('button');
    btn.style.background = hex;
    btn.onclick = () => {
      document.getElementById('colorPicker').value = hex;
      if(catMesh) catMesh.material.color.set(hex);
      swatchRow.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    };
    swatchRow.appendChild(btn);
  });

}catch(err){
  setStatus('❌ 初始化失敗：' + err.message + '\n\n可能是瀏覽器不支援 ES Module 或 WebGL，換個瀏覽器（Chrome/Edge/Safari 最新版）試試看。', 'err');
  console.error(err);
}

// 保險：如果 15 秒後狀態還停在「載入中」，代表可能連 script 本身都沒跑起來
// （例如 import map 被瀏覽器擋掉），額外提示一次
setTimeout(() => {
  if(statusEl.textContent.includes('載入中') && !statusEl.textContent.includes('下載')){
    setStatus('❌ 一直停在「載入中」，可能是瀏覽器版本太舊不支援 import map。\n請改用最新版 Chrome、Edge 或 Safari 測試。', 'err');
  }
}, 15000);
</script>
</body>
</html>
