<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 貓咪模型測試</title>
<style>
  body{margin:0;font-family:-apple-system,'Noto Sans TC',sans-serif;background:#EDEEDF;color:#26301F;}
  #info{padding:16px 20px;}
  #info h1{font-size:18px;margin:0 0 4px;}
  #info p{font-size:13px;color:#68705C;margin:0 0 12px;}
  #canvas-wrap{width:100%;height:60vh;position:relative;background:#FFFFFC;}
  #canvas-wrap canvas{display:block;}
  #controls{padding:16px 20px;background:#FFFFFC;border-top:1px solid #D9DCC5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:#68705C;margin-bottom:6px;font-weight:600;}
  .field input[type=color]{width:60px;height:36px;border:1.5px solid #D9DCC5;border-radius:8px;cursor:pointer;padding:2px;}
  .field input[type=range]{width:100%;}
  .swatch-row{display:flex;gap:8px;margin-top:8px;}
  .swatch-row button{width:36px;height:36px;border-radius:8px;border:2px solid transparent;cursor:pointer;}
  .swatch-row button.active{border-color:#26301F;}
  #status{font-size:12px;color:#9C5F34;padding:10px 20px;}
</style>
</head>
<body>
<div id="info">
  <h1>🐾 3D 貓咪模型測試</h1>
  <p>載入你上傳的模型，測試 Three.js 顯示與顏色套用效果</p>
</div>
<div id="status">載入中…</div>
<div id="canvas-wrap"></div>
<div id="controls">
  <div class="field">
    <label>毛色（可以拖 hex 色碼進來，也可以直接點選）</label>
    <input type="color" id="colorPicker" value="#151413">
    <div class="swatch-row" id="quickSwatches"></div>
  </div>
  <div class="field">
    <label>旋轉速度</label>
    <input type="range" id="rotateSpeed" min="0" max="0.02" step="0.001" value="0.006">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const statusEl = document.getElementById('status');
const wrap = document.getElementById('canvas-wrap');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xFFFFFC);

const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
camera.position.set(0, 0.6, 3.2);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio || 1);
wrap.appendChild(renderer.domElement);

// 燈光：一盞主光 + 環境光，讓模型看起來立體但不會死黑
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(2, 3, 4);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight2.position.set(-2, 1, -3);
scene.add(dirLight2);

let catMesh = null;
let rotateSpeed = 0.006;

// 用簡單的 OBJ 手動解析（避免額外依賴 OBJLoader 外部檔案），
// 這裡改用最穩妥的方式：直接抓取轉檔時輸出的 glb，用原生 GLTFLoader。
const loaderScript = document.createElement('script');
loaderScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js';
loaderScript.onload = () => {
  const loader = new THREE.GLTFLoader();
  loader.load('./cat.glb', (gltf) => {
    const model = gltf.scene;
    model.traverse(obj => {
      if(obj.isMesh){
        catMesh = obj;
        obj.material = new THREE.MeshStandardMaterial({
          color: new THREE.Color(document.getElementById('colorPicker').value),
          roughness: 0.85,
          metalness: 0.05
        });
      }
    });
    scene.add(model);
    statusEl.textContent = '✅ 模型載入成功，可以用下方調色盤試試套色效果';
    statusEl.style.color = '#4C6B3F';
  }, undefined, (err) => {
    statusEl.textContent = '❌ 模型載入失敗：' + err.message + '（確認 cat.glb 跟這個 html 檔案放在同一層資料夾）';
    statusEl.style.color = '#AE4A34';
    console.error(err);
  });
};
document.head.appendChild(loaderScript);

function animate(){
  requestAnimationFrame(animate);
  if(catMesh) catMesh.parent.rotation.y += rotateSpeed;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = wrap.clientWidth / wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
});

// 套色控制
document.getElementById('colorPicker').addEventListener('input', (e) => {
  if(catMesh) catMesh.material.color.set(e.target.value);
});
document.getElementById('rotateSpeed').addEventListener('input', (e) => {
  rotateSpeed = Number(e.target.value);
});

// 快速色票：布朗尼分析出來的顏色，方便直接點選測試
const testColors = ['#151413', '#060505', '#2c2924', '#979185', '#BE7A46', '#F1E2CE'];
const swatchRow = document.getElementById('quickSwatches');
testColors.forEach(hex => {
  const btn = document.createElement('button');
  btn.style.background = hex;
  btn.onclick = () => {
    document.getElementById('colorPicker').value = hex;
    if(catMesh) catMesh.material.color.set(hex);
    swatchRow.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  };
  swatchRow.appendChild(btn);
});
</script>
</body>
</html>
